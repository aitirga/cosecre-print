<!--
  Source for brand/wordmark.png — the README banner.

  Rendered through Chrome rather than a plain SVG because the wordmark uses a
  system font: baking it to pixels is what keeps it identical on GitHub, in
  docs, and anywhere else the SVG's font would not resolve.

  Regenerate with `npm run brand`.
-->
<style>
  :root {
    --mist-50: #fdfeff;
    --mist-100: #f5f9fe;
    --mist-300: #e0eaf8;
    --mist-400: #cedcf0;
    --ink-500: #5a7091;
    --ink-900: #1b2c46;
    --accent-700: #2f5aa8;
  }
  body {
    margin: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .banner {
    display: inline-flex;
    align-items: center;
    gap: 26px;
    padding: 40px 60px;
    background: linear-gradient(160deg, var(--mist-50) 0%, var(--mist-300) 100%);
    border: 1px solid var(--mist-400);
    border-radius: 22px;
  }
  .text { display: flex; flex-direction: column; gap: 9px; }
  .wordmark { font-size: 46px; line-height: 1; letter-spacing: -0.03em; }
  .wordmark b { font-weight: 650; color: var(--ink-900); }
  .wordmark i { font-style: normal; font-weight: 400; color: var(--ink-500); }
  .tagline { font-size: 16px; color: var(--ink-500); letter-spacing: -0.005em; }
  .tagline em { font-style: normal; color: var(--accent-700); font-weight: 500; }
</style>

<div class="banner">
  <svg width="97" height="97" viewBox="76 64 384 384" aria-label="Cosecre-print">
    <defs>
      <linearGradient id="paper" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#ffffff" />
        <stop offset="1" stop-color="#f2f7fe" />
      </linearGradient>
      <linearGradient id="blue" x1="0" y1="0" x2="0.4" y2="1">
        <stop offset="0" stop-color="#7ea8ee" />
        <stop offset="1" stop-color="#2f5aa8" />
      </linearGradient>
    </defs>
    <path d="M 329.7 350.9 A 132 132 0 1 1 329.7 161.1" transform="translate(-8 0)"
          fill="none" stroke="url(#blue)" stroke-width="58" />
    <rect x="210" y="214" width="232" height="84" rx="19"
          fill="url(#paper)" stroke="#2f5aa8" stroke-width="13" />
    <g fill="#2f5aa8" opacity="0.5">
      <rect x="248" y="238" width="152" height="13" rx="6.5" />
      <rect x="248" y="262" width="100" height="13" rx="6.5" />
    </g>
  </svg>

  <div class="text">
    <span class="wordmark"><b>Cosecre</b><i>-print</i></span>
    <span class="tagline">Print PDF and Word documents <em>concurrently</em></span>
  </div>
</div>
