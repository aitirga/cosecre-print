<?xml version="1.0" encoding="UTF-8"?>
<!--
  Cosecre-print — the bare mark, no tile, transparent background.

  For use on surfaces that already have their own background: the app's own
  title bar, the README banner, docs. The viewBox is cropped tight to the
  artwork and then padded back out to square so the mark sits centred in a
  square slot.

  The React copy of this lives in src/renderer/src/components/logo.tsx — keep
  the two in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="78 70 372 372" width="372" height="372">
  <defs>
    <linearGradient id="markPaper" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d7e0f2" />
    </linearGradient>
    <linearGradient id="markBlue" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#6ba2ff" />
      <stop offset="1" stop-color="#2f6fdd" />
    </linearGradient>
  </defs>

  <path d="M 329.7 350.9 A 132 132 0 1 1 329.7 161.1"
        transform="translate(-8 0)"
        fill="none" stroke="url(#markBlue)" stroke-width="58" />
  <rect x="210" y="214" width="232" height="84" rx="19" fill="url(#markPaper)" />
  <g fill="#0b0d12" opacity="0.55">
    <rect x="248" y="238" width="152" height="13" rx="6.5" />
    <rect x="248" y="262" width="100" height="13" rx="6.5" />
  </g>
</svg>
